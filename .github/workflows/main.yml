name: Build Peugeot Master APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses & Install Gradle
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-32" "build-tools;32.0.0"
          sudo apt-get update && sudo apt-get install -y unzip gradle

      - name: Build Cordova APK
        run: |
          npm install -g cordova@11.1.0
          cordova telemetry off
          cordova create app com.ahmed.peugeotmaster "PeugeotMaster"
          if [ -f "Peugeot_OBD_BSI_Master_APK_Project.zip" ]; then
            unzip -o Peugeot_OBD_BSI_Master_APK_Project.zip -d extracted/
            cp -r extracted/www/* app/www/
          fi
          cd app
          cordova platform add android@11.0.0
          cordova plugin add cordova-plugin-bluetooth-serial
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot-Master-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
