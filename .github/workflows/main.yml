name: Build APK from ZIP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract ZIP and Build APK
        run: |
          unzip -o Peugeot_OBD_BSI_Master_APK_Project.zip
          npm install -g cordova
          cordova create app com.ahmed.peugeotmaster "Peugeot Master"
          cp config.xml app/
          cp -r www/* app/www/
          cd app
          cordova platform add android
          cordova plugin add cordova-plugin-bluetooth-serial
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Peugeot-Master-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
